observability:
  log_level: info
  log_format: json
  admin_addr: 127.0.0.1:9000
  shutdown_timeout: 15s

lb:
  listeners:
    - id: web
      proto: http
      bind: 127.0.0.1:18080
      pool: web_pool
      max_conns: 1000
    - id: raw
      proto: tcp
      bind: 127.0.0.1:18022
      pool: web_pool
      max_conns: 1000
  pools:
    - id: web_pool
      picker: least_connections
      backends:
        - {id: b1, addr: "127.0.0.1:18091", weight: 1}
      health:
        kind: tcp
        interval: 5s
        timeout: 2s
        rise: 1
        fall: 3

dns:
  role: node
  node_id: test-node
  location: test-lab
  interval: 60s
  ring_cap: 4096
  ship_every: 5s
  ship_size: 64
  spool_max: 1MiB
  resolvers:
    - {addr: "1.1.1.1:53", concurrency: 4, timeout: 2s}
  targets:
    - {zone: "example.com.", name: "example.com.", type: A, view: recursive}
  hub:
    url: "http://127.0.0.1:19001"

tls:
  interval: 3600s
  expiry_warn_days: 14
  expiry_crit_days: 3
  consecutive_failures: 3
  targets:
    - {host: "example.com", port: 443, floor: "1.2", verify: report}

media:
  bind: 127.0.0.1:18081
  root: ./bench/fixtures
  max_streams: 16
  max_streams_per_client: 4
  io_mode: sendfile
  readahead: 1MiB
  read_header_timeout: 10s
  idle_timeout: 120s
  write_timeout: 300s
  disk_high_water: 0.9

bench:
  scenario_dir: bench/scenarios
  results_dir: bench/results
  timeout: 300s